name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Program — host tests (policy order, error codes, PDA vectors)
        run: pnpm test:program:host
      - name: Program — IDL build compiles
        run: cargo test -p policy-vault --features idl-build __anchor_private_print_idl --quiet
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:web
      - name: Zero-Mock grep (AGENTS.md §3)
        run: |
          if grep -rniE "\b(mock|fake|dummy|lorem)" apps packages programs \
              --include=*.ts --include=*.tsx --include=*.rs --exclude-dir=node_modules; then
            echo "Zero-Mock policy violation"; exit 1
          fi
